<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Ed-Tech</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        /* Modern Signup Page Styles */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow-x: hidden;
            padding: 20px 0;
        }

        /* Animated Background Shapes */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        body::before {
            width: 400px;
            height: 400px;
            top: -200px;
            right: -200px;
            animation-delay: 1s;
        }

        body::after {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -150px;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(40px, -40px) rotate(180deg); }
        }

        #loginbox {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            padding: 0;
            margin: 20px;
            animation: slideUp 0.6s ease-out;
            position: relative;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #loginbox fieldset {
            border: none;
            padding: 40px;
            margin: 0;
        }

        .logo-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .edtech-logo {
            width: 80px;
            height: 80px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        legend h2 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin: 0;
        }

        .edtech-tagline {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-form label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }

        .signup-form input,
        .signup-form select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
        }

        .signup-form input:focus,
        .signup-form select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .signup-form select {
            cursor: pointer;
            background: white;
        }

        .email-otp-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: start;
            margin-bottom: 20px;
        }

        .email-otp-row input {
            margin-bottom: 0;
        }

        .otp-button {
            padding: 14px 20px !important;
            white-space: nowrap;
            margin-bottom: 0 !important;
            font-size: 14px !important;
        }

        #otpsection {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-bottom: 0;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-auth {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin: 20px 0 0 0;
        }

        .switch-auth a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .switch-auth a:hover {
            color: #764ba2;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            #loginbox fieldset {
                padding: 30px 25px;
            }

            legend h2 {
                font-size: 24px;
            }

            .edtech-logo {
                width: 60px;
                height: 60px;
            }

            .email-otp-row {
                grid-template-columns: 1fr;
            }

            .otp-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="loginbox">
        <fieldset>
            <legend>
                <a href="index.html" class="logo-link">
                    <img src="https://img.icons8.com/color/96/000000/graduation-cap.png" alt="Ed-Tech Logo" class="edtech-logo">
                    <h2>Join as Student</h2>
                </a>
            </legend>
            <p class="edtech-tagline">Create your student account and start learning today!</p>
            <form onsubmit="return validateSignup(event)" class="signup-form">
                <label for="email">Email Address</label>
                <div class="email-otp-row">
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <button type="button" onclick="showotp()" class="signup-btn otp-button">Get OTP</button>
                </div>

                <div id="otpsection">
                    <label for="OTP">Enter OTP</label>
                    <input type="number" id="OTP" min="100000" max="999999" placeholder="6-digit OTP">
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password (min. 6 characters)" required minlength="6">

                <button type="submit" class="signup-btn">Sign Up</button>
                
                <p class="switch-auth">
                    Already have an account? <a href="login.html">Login</a>
                </p>
                
                <p class="switch-auth">
                    Are you a teacher? <a href="teacher-signup.html">Sign up as Teacher</a>
                </p>
            </form>
        </fieldset>
    </div>
</body>

</html>
