<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Ed-Tech</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ultra-Modern Forgot Password Page Styles */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Background Particles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        body::after {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -30px) rotate(180deg); }
        }

        /* Glassmorphism Effect */
        #loginbox {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35), 
                        0 0 0 1px rgba(255, 255, 255, 0.3);
            max-width: 480px;
            width: 90%;
            padding: 0;
            margin: 20px;
            animation: slideUpFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        /* Decorative gradient bar */
        #loginbox::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideUpFadeIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #loginbox fieldset {
            border: none;
            padding: 50px 45px;
            margin: 0;
        }

        .logo-link {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .edtech-logo {
            width: 90px;
            height: 90px;
            animation: bounce 2.5s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.3));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        legend h2 {
            color: #1a1a2e;
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .edtech-tagline {
            color: #666;
            font-size: 15px;
            text-align: center;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .signup-form label {
            color: #2d3748;
            font-size: 14px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        .signup-form input[type="email"],
        .signup-form input[type="text"],
        .signup-form input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: white;
            box-sizing: border-box;
        }

        .signup-form input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 80px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .toggle-password:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .signup-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .signup-btn:active {
            transform: translateY(-1px);
        }

        .switch-auth {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .switch-auth a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .switch-auth a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            #loginbox fieldset {
                padding: 35px 25px;
            }

            legend h2 {
                font-size: 26px;
            }

            .edtech-logo {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div id="loginbox">
        <fieldset>
            <legend>
                <a href="index.html" class="logo-link">
                    <img src="https://img.icons8.com/color/96/000000/graduation-cap.png" alt="Ed-Tech Logo" class="edtech-logo">
                    <h2>Reset Your Password</h2>
                </a>
            </legend>
            <p class="edtech-tagline">Enter your email to receive a password reset code</p>
            
            <!-- Step 1: Request OTP -->
            <form id="requestOtpForm" class="signup-form" onsubmit="return requestPasswordResetOTP(event)">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your registered email" required>
                
                <button type="submit" class="signup-btn">Send Reset Code</button>
                
                <p class="switch-auth">
                    Remember your password? <a href="login.html">Login</a>
                </p>
            </form>

            <!-- Step 2: Reset Password (hidden initially) -->
            <form id="resetPasswordForm" class="signup-form" style="display: none;" onsubmit="return resetPassword(event)">
                <label for="otp">Enter 6-Digit OTP</label>
                <input type="text" id="otp" maxlength="6" pattern="[0-9]{6}" placeholder="Enter OTP sent to your email" required>
                
                <label for="newPassword">New Password</label>
                <div class="password-field">
                    <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePasswordField('newPassword', this)">Show</button>
                </div>
                
                <label for="confirmPassword">Confirm New Password</label>
                <div class="password-field">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePasswordField('confirmPassword', this)">Show</button>
                </div>
                
                <button type="submit" class="signup-btn">Reset Password</button>
                
                <p class="switch-auth">
                    <a href="#" onclick="showRequestOtpForm(); return false;">Request new code</a>
                </p>
            </form>
        </fieldset>
    </div>

    <script src="script.js"></script>
</body>
</html>
